name: matrix

# Coolify deployment notes
# ------------------------
# * Deploy as: New Resource -> Service -> Docker Compose from repository
#   (this repo, compose location /docker-compose.yaml).
# * Set SYNAPSE_SERVER_NAME BEFORE the first deploy: it is baked into every
#   Matrix ID and cannot be changed afterwards.
# * Assign the domains BEFORE the first deploy so the generated SERVICE_URL
#   values are correct: synapse:8008, element:80, ketesa:80.
# * No custom Docker networks are defined. Services share Coolify's network, so
#   its proxy can route to them; nothing is published except the declared
#   domains, and PostgreSQL has no ports at all (unreachable from outside).
# * The Synapse entrypoint is inline on purpose: a bind mount of a repo file
#   (./scripts/...) fails when Coolify's deploy directory does not contain it.

services:
  # Image policy: floating tags (user request). Coolify does not re-pull by
  # itself - after an upstream release, redeploy with a fresh pull to move
  # (Coolify: "Redeploy" with force pull / "Redeploy without cache").
  # A Synapse update runs its own database migrations on the next boot, which is
  # why the healthcheck below allows a long start period.
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    init: true
    environment:
      - SERVICE_URL_SYNAPSE_8008
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME:?Set the permanent Matrix server name}
      - SYNAPSE_PUBLIC_URL=${SYNAPSE_PUBLIC_URL:?Set the public HTTPS URL of Synapse, e.g. https://matrix.example.com}
      - SYNAPSE_REPORT_STATS=${SYNAPSE_REPORT_STATS:-no}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-false}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-50M}
      - POSTGRES_DB=${POSTGRES_DB:-synapse}
      - POSTGRES_USER=${SERVICE_LOWERCASEUSER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
      - ADMIN_USER=${SERVICE_LOWERCASEUSER_ADMIN}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_64_ADMIN}
    volumes:
      - synapse-data:/data
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -Eeuo pipefail
        # NOT 077: files created here are owned by root, and Synapse's image drops
        # privileges to the synapse user (991:991) before starting the server.
        # 0600 root-owned files make it die with:
        #   PermissionError: [Errno 13] Permission denied: '/data/<server>.log.config'
        umask 022

        # 1) Generate the base config. Idempotent: existing signing key,
        #    registration/macaroon secrets are reused from /data, never rotated.
        /start.py generate

        # 2) Apply the deployment's settings on EVERY boot (not just the first),
        #    so ENABLE_REGISTRATION / MAX_UPLOAD_SIZE changes take effect and a
        #    redeploy reproduces the same config.
        python3 - <<'PY'
        import os
        from pathlib import Path

        import yaml

        path = Path("/data/homeserver.yaml")
        config = yaml.safe_load(path.read_text())

        public_url = (os.environ.get("SYNAPSE_PUBLIC_URL")
                      or os.environ.get("SERVICE_URL_SYNAPSE")
                      or os.environ.get("SERVICE_URL_SYNAPSE_8008", "")).rstrip("/") + "/"
        registration_enabled = os.getenv("ENABLE_REGISTRATION", "false").lower() == "true"

        config.update({
            "public_baseurl": public_url,
            "serve_server_wellknown": True,
            "database": {
                "name": "psycopg2",
                "args": {
                    "user": os.environ["POSTGRES_USER"],
                    "password": os.environ["POSTGRES_PASSWORD"],
                    "database": os.environ["POSTGRES_DB"],
                    "host": "postgres",
                    "port": 5432,
                    "cp_min": 5,
                    "cp_max": 10,
                },
            },
            "enable_registration": registration_enabled,
            "registration_requires_token": True,
            "allow_public_rooms_without_auth": False,
            "allow_public_rooms_over_federation": False,
            "url_preview_enabled": False,
            "max_upload_size": os.getenv("MAX_UPLOAD_SIZE", "50M"),
            "federation_verify_certificates": True,
        })

        # /start.py generate writes registration_shared_secret from a value that
        # persists in /data (or from SYNAPSE_REGISTRATION_SHARED_SECRET). Warn
        # loudly if it is missing: the initial admin cannot be registered without it.
        if not config.get("registration_shared_secret"):
            print("[entrypoint] WARNING: registration_shared_secret missing; "
                  "initial admin registration will fail", flush=True)

        for listener in config.get("listeners", []):
            if listener.get("type") == "http":
                listener["x_forwarded"] = True
                listener["bind_addresses"] = ["0.0.0.0"]
                listener["resources"] = [{"names": ["client", "federation"], "compress": False}]

        path.write_text(yaml.safe_dump(config, sort_keys=False))
        PY

        # 3) Create the initial admin once Synapse is up (idempotent).
        create_initial_admin() {
          until curl --fail --silent http://127.0.0.1:8008/health >/dev/null; do
            sleep 2
          done
          if register_new_matrix_user \
              --admin \
              --user "$$ADMIN_USER" \
              --password "$$ADMIN_PASSWORD" \
              --config /data/homeserver.yaml \
              http://127.0.0.1:8008 >/tmp/admin-create.log 2>&1; then
            echo "[entrypoint] initial admin '$$ADMIN_USER' created"
          elif grep -qiE "already (taken|exists)" /tmp/admin-create.log; then
            echo "[entrypoint] admin '$$ADMIN_USER' already exists"
          else
            echo "[entrypoint] WARNING: admin creation failed:" >&2
            cat /tmp/admin-create.log >&2
          fi
        }
        # The image runs this entrypoint as root and then drops to the synapse user
        # (991:991) for the server process, so everything under /data must be
        # readable by it. This also repairs root-owned leftovers from earlier
        # failed deployments, which is what produced the PermissionError.
        if [ "$(id -u)" = "0" ]; then
          chown -R 991:991 /data 2>/dev/null || true
          chmod -R a+rX /data
        fi

        create_initial_admin &

        exec /start.py
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8008/health"]
      interval: 15s
      timeout: 5s
      # First boot runs database migrations; a short window marks a healthy
      # container unhealthy and makes 'compose up -d' exit 1.
      retries: 20
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    init: true
    environment:
      - SERVICE_URL_ELEMENT_80
      # The public Synapse URL, passed straight through. Deliberately NOT a
      # SERVICE_URL_* cross-reference: Coolify populates those only in the
      # declaring service's context, so referencing one from another service
      # resolves to a blank string at parse time (seen as:
      #   "The SERVICE_URL_SYNAPSE_8008 variable is not set. Defaulting to a blank string.").
      - SYNAPSE_PUBLIC_URL=${SYNAPSE_PUBLIC_URL:?Set the public HTTPS URL of Synapse, e.g. https://matrix.example.com}
    command:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${SYNAPSE_PUBLIC_URL}" ]; then
          echo "SYNAPSE_PUBLIC_URL is empty - set it in Coolify and redeploy" >&2
          exit 1
        fi
        # Element Web serves its runtime config from /tmp/element-web-config/config.json
        # (nginx: `location /config { root /tmp/element-web-config; }`). The image's own
        # entrypoint copies /app/config*.json there before this command runs, so a config
        # written to /app at this point is never served - the client would load the
        # bundled sample config. /tmp is writable by the image's nginx user, so no root.
        mkdir -p /tmp/element-web-config
        cat > /tmp/element-web-config/config.json <<EOF
        {
          "default_server_config": {
            "m.homeserver": {
              "base_url": "$${SYNAPSE_PUBLIC_URL}"
            }
          },
          "disable_custom_urls": true,
          "disable_guests": true,
          "disable_3pid_login": true,
          "brand": "Element",
          "default_theme": "dark",
          "room_directory": {
            "servers": ["matrix.org"]
          },
          "setting_defaults": {
            "UIFeature.registration": false
          }
        }
        EOF
        # Hand over to the image's own entrypoint. It runs /docker-entrypoint.d/*,
        # which generates /etc/nginx/conf.d/default.conf from /etc/nginx/templates/
        # and copies /app/config*.json into /tmp/element-web-config/. That template is
        # the ONLY place the `location /config` block exists: starting nginx directly
        # (as a bare command override does) leaves the stock nginx config in place,
        # /config.json 404s, and the client cannot load its configuration at all.
        # The entrypoint only runs those hooks when its first argument is `nginx`,
        # so it must be invoked explicitly.
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/config.json"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      synapse:
        condition: service_started

  ketesa:
    image: ghcr.io/etkecc/ketesa:latest
    restart: unless-stopped
    init: true
    environment:
      # The image serves on 8080 (SERVER_PORT=8080; its own healthcheck probes
      # localhost:8080/health), so the proxy must route the domain to 8080 - not 80.
      - SERVICE_URL_KETESA_8080
    security_opt:
      - no-new-privileges:true
    depends_on:
      synapse:
        condition: service_started

  postgres:
    # Floating within major 17 on purpose: a major version jump against an
    # existing data directory makes Postgres refuse to start and can cost the
    # homeserver database. Change to postgres:latest only together with a
    # dump/restore or pg_upgrade.
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${SERVICE_LOWERCASEUSER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  synapse-data:
  postgres-data:
